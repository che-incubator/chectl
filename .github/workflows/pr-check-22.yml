name: PR Checks
on: [pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install yarn deps
        run: yarn --immutable && yarn rebuild
      - name: Run eslint
        run: yarn lint
      - name: Run unit tests
        run: yarn test
  readme-md-validation:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Build chectl and pack binaries
        run: |
          yarn --immutable && yarn rebuild
          export PATH="${PATH}:${PWD}/bin/shasum"
          yarn pack-binaries --targets=linux-x64
      - name: Build README.md
        run: DEBUG=* npx oclif readme
      - name: Check README.md state
        run: |
          IFS=$'\n' read -d '' -r -a FILES_CHANGED_ARRAY < <( git ls-files -m ) || true
          # check if readme it is up to date
          if [[ " ${FILES_CHANGED_ARRAY[@]} " =~ "README.md" ]]; then
            echo "[ERROR] README.md it is not up to date. Please run 'yarn oclif readme' to update and commit the changes."
            exit 1
          fi
